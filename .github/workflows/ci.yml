name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Temporary dependency advisory detail
        run: |
          npm audit --json > /tmp/nexus-audit.json || true
          node -e "const r=require('/tmp/nexus-audit.json'); for (const [name,v] of Object.entries(r.vulnerabilities || {})) console.log(name + ' | ' + v.severity + ' | direct=' + v.isDirect + ' | range=' + v.range + ' | fix=' + JSON.stringify(v.fixAvailable));"
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
